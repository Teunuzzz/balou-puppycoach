<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#184f43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Balou Puppycoach</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><meta name="apple-mobile-web-app-title" content="Balou"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20342e;background:#f5f6f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:680px;margin:auto;padding:18px 16px 90px}header{background:#184f43;color:white;padding:24px 20px 28px;border-radius:0 0 26px 26px}header .wrap{padding:0}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8}h1{font-size:32px;margin:8px 0}h2{font-size:20px;margin:0 0 12px}p{line-height:1.5}.muted{color:#65736c;font-size:14px}.hero{font-size:16px;line-height:1.5}.pill{display:inline-block;background:#e6efe7;border-radius:30px;padding:7px 12px;font-size:13px;margin:4px 5px 0 0}.card{background:white;border:1px solid #e6e9e2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #102e1810}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#f5f6f1;padding:12px 0;z-index:5}.tabs button{white-space:nowrap;background:white;color:#2c5347;border:1px solid #dce6dd;border-radius:30px;padding:11px 15px;font-weight:650}.tabs button.active{background:#184f43;color:white}.item{padding:13px 0;border-bottom:1px solid #edf0eb;display:flex;gap:12px;align-items:flex-start}.item:last-child{border:0}.item input{width:21px;height:21px;accent-color:#26745d;flex-shrink:0}.item b{display:block}.item small{display:block;color:#65736c;line-height:1.45;margin-top:4px}.tag{font-size:12px;background:#edf3ed;border-radius:8px;padding:4px 7px;white-space:nowrap}.btn{background:#184f43;color:white;border:0;padding:12px 16px;border-radius:12px;font-weight:700}.secondary{background:#e9f0e9;color:#184f43}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input[type=date],input[type=time],select{width:100%;border:1px solid #cbd8cf;border-radius:10px;padding:11px;background:white;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#eaf2e9;padding:13px;border-radius:13px}.metric strong{display:block;font-size:22px}.metric span{font-size:12px;color:#526b5c}.note{background:#fff5de;border-left:4px solid #d59a2e;padding:12px;border-radius:8px;font-size:14px;line-height:1.5}.progress{height:9px;background:#e7eee8;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#3c8b70}details{padding:13px 0;border-bottom:1px solid #e9eee9}summary{font-weight:700;cursor:pointer}details p{font-size:14px}footer{font-size:12px;color:#738077;text-align:center;margin:30px 0}.hide{display:none}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.date{font-size:13px;opacity:.8}textarea{width:100%;min-height:80px;border:1px solid #cbd8cf;border-radius:10px;padding:10px;font:inherit}button{cursor:pointer}</style></head><body><header><div class="wrap"><div class="eyebrow">🐾 Jouw puppycoach</div><h1>Balou <span style="font-size:20px">🐕</span></h1><div class="date" id="today"></div><div class="hero" id="intro"></div></div></header><main class="wrap"><nav class="tabs" id="tabs"><button data-tab="vandaag" class="active">Vandaag</button><button data-tab="uitlaten">Uitlaten</button><button data-tab="oefenen">Oefenen</button><button data-tab="gids">Puppygids</button><button data-tab="instellingen">Instellingen</button></nav><section id="vandaag"></section><section id="uitlaten" class="hide"></section><section id="oefenen" class="hide"></section><section id="gids" class="hide"></section><section id="instellingen" class="hide"></section><footer>Balou Puppycoach · Gezamenlijke voortgang</footer></main><script>
const defaults={birth:'2026-09-26',home:'2026-11-21',wake:'07:00',bed:'22:30',meals:3};let cfg={...defaults,...JSON.parse(localStorage.getItem('balou_config')||'{}')};const $=id=>document.getElementById(id);const localDay=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const parse=s=>new Date(s+'T12:00:00');const days=(a,b)=>Math.round((parse(a)-parse(b))/86400000);const date=localDay();const ageDays=Math.max(0,days(date,cfg.birth));const weeks=Math.floor(ageDays/7);const atHome=days(date,cfg.home)>=0;const walk=weeks<10?'5–10':weeks<12?'10–15':weeks<14?'10–20':weeks<16?'15–20':weeks<20?'15–25':weeks<24?'20–30':weeks<28?'25–35':weeks<40?'30–45':'35–60';const training=weeks<12?3:weeks<20?5:8;const taskKey=id=>'balou_'+date+'_'+id;const checked=id=>localStorage.getItem(taskKey(id))==='1';function check(id,v){
  window.balouSync?.check(id,v);
  localStorage.setItem(taskKey(id),v?'1':'0');
  updateProgress();
};function timeAdd(s,mins){let [h,m]=s.split(':').map(Number);let n=(h*60+m+mins+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};function entry(id,title,detail,time){return `<label class="item"><input type="checkbox" data-check="${id}" ${checked(id)?'checked':''}><span>${time?`<span class="tag">${time}</span> `:''}<b>${title}</b><small>${detail}</small></span></label>`}function progress(){let ids=[...document.querySelectorAll('#vandaag [data-check]')];let n=ids.filter(x=>x.checked).length;return `<div class="muted" id="progressText">${n} van ${ids.length} taken gedaan</div><div class="progress"><div id="progressFill" style="width:${ids.length?n/ids.length*100:0}%"></div></div>`}function updateProgress(){let ids=[...document.querySelectorAll('#vandaag [data-check]')],n=ids.filter(x=>x.checked).length;if($('progressText'))$('progressText').textContent=`${n} van ${ids.length} taken gedaan`;if($('progressFill'))$('progressFill').style.width=(ids.length?n/ids.length*100:0)+'%'}
const schedule=[['wakker','Wakker → direct plassen','Meteen naar buiten, rustig belonen zodra Balou plast.',cfg.wake],['ontbijt','Ontbijt','Geef de passende hoeveelheid puppyvoer volgens verpakking en lichaamsconditie.',timeAdd(cfg.wake,15)],['naontbijt','Plaspauze na eten','Na het eten en drinken opnieuw even naar buiten.',timeAdd(cfg.wake,30)],['rust1','Slapen / prikkelarme rust','Laat hem ongestoord slapen; jonge pups hebben veel slaap nodig.',timeAdd(cfg.wake,50)],['wandeling1','Snuffelrondje','Circa '+walk+' minuten als hij dat prettig aankan; niet doorlopen om de tijd vol te maken.',timeAdd(cfg.wake,150)],['oefening1','Mini-training','Oefen '+training+' minuten naamherkenning en hierkomen met beloningen.',timeAdd(cfg.wake,180)],['rust2','Rust en slapen','Laat hem na nieuwe indrukken herstellen.',timeAdd(cfg.wake,210)],['middag','Middageten + plasronde',cfg.meals>=3?'Eten en direct daarna naar buiten.':'Bij twee maaltijden: korte plasronde en rust.',timeAdd(cfg.wake,300)],['wandeling2','Snuffelrondje','Rustige route, laat Balou zelf snuffelen en pauzeren.',timeAdd(cfg.wake,450)],['oefening2','Socialisatie op maat','Eén positieve nieuwe ervaring, met afstand en keuzevrijheid.',timeAdd(cfg.wake,480)],['rust3','Lange rustpauze','Rust is onderdeel van de opvoeding.',timeAdd(cfg.wake,510)],['avond','Avondeten + plasronde','Eten, water beschikbaar en daarna naar buiten.',timeAdd(cfg.wake,630)],['wandeling3','Avondrondje','Kort en rustig; liever snuffelen dan kilometers maken.',timeAdd(cfg.wake,720)],['oefening3','Rustige oefening','Oefen loslaten of rustig op een kleed liggen.',timeAdd(cfg.wake,750)],['laatste','Laatste plasronde','Rustig naar buiten, daarna slapen.',cfg.bed]];
const exerciseBank=[['Naam en aandacht','Zeg één keer “Balou”. Kijkt hij naar je? Beloon direct. Herhaal 3–5 keer.'],['Hierkomen','Hurken, vrolijk “Balou, hier!” zeggen en belonen wanneer hij komt. Begin binnenshuis.'],['Zindelijkheid','Breng hem na wakker worden, eten en spelen naar dezelfde rustige plek. Beloon direct buiten.'],['Rust op kleed','Beloon vrijwillig rustig liggen op zijn kleed. Bouw seconden langzaam op.'],['Zacht bijten','Stop rustig het spel als tanden huid raken. Bied geschikt kauwspeelgoed aan.'],['Aan tuig en lijn wennen','Laat hem het tuig bekijken, beloon, doe het kort om en houd de ervaring positief.'],['Loslaten','Ruil een speeltje voor iets lekkers, zeg “los” wanneer hij loslaat, geef het speeltje terug.'],['Alleen zijn','Oefen eerst enkele seconden afstand terwijl hij ontspannen is. Keer terug vóór paniek ontstaat.'],['Verzorging','Raak kort een poot, oor of halsband aan, beloon en stop voordat hij zich ongemakkelijk voelt.'],['Nieuwe geluiden','Laat een zacht geluid horen op veilige afstand; beloon ontspannen gedrag. Forceer niets.'],['Lijn zonder trekken','Beloon vrijwillig naast je lopen. Stop of verander richting bij trekken zonder rukken.'],['Wachten','Vraag een seconde rust voordat je de voerbak neerzet. Bouw heel geleidelijk op.']];const guide=[['Zindelijkheid','Ga naar buiten na slapen, eten, drinken en spelen, en tussendoor wanneer hij wakker is. Beloon direct buiten. Straf ongelukjes nooit. Maak binnen schoon met enzymreiniger. Jonge pups kunnen ook ’s nachts nog moeten plassen.'],['Socialisatie','Laat Balou op zijn eigen tempo verschillende mensen, geluiden, oppervlakken en omgevingen ontdekken. Kwaliteit is belangrijker dan aantallen. Vermijd overweldigende situaties en onbekende honden met onduidelijke gezondheidsstatus. Bespreek veilige uitstapjes vóór de volledige vaccinaties met de dierenarts.'],['Slapen en bench','Jonge pups slapen vaak 18–20 uur per etmaal. Maak de bench een vrijwillige veilige plek met rustige positieve opbouw. Gebruik de bench nooit als straf. Laat hem niet langdurig opgesloten of in paniek achter.'],['Bijten en kauwen','Puppybijten is normaal. Leid om naar geschikt kauwspeelgoed, pauzeer spel bij hard bijten en zorg voor voldoende slaap. Vermijd fysieke correcties.'],['Alleen thuis blijven','Begin met heel korte, ontspannen afwezigheid van seconden. Vergroot alleen als Balou rustig blijft. Gebruik eventueel een camera om stresssignalen te herkennen.'],['Voeding en water','Gebruik compleet puppyvoer passend bij een groot ras. Weeg porties af en pas aan op groei en lichaamsconditie. Vers drinkwater moet beschikbaar blijven. Gebruik een deel van zijn dagelijkse brokken als trainingsbeloning.'],['Bewegen en gewrichten','Geen vaste vijf-minutenregel als harde grens: die is niet wetenschappelijk onderbouwd. Kies korte ontspannen wandelingen en zelfgestuurd spel. Vermijd gedwongen lange afstanden, veel herhaald springen en rennen naast de fiets. Let op stijfheid, kreupelheid en vermoeidheid.'],['Kinderen en pup','Laat kinderen nooit zonder toezicht met Balou. Niet storen tijdens eten of slapen, niet optillen of achtervolgen. Laat kinderen rustige zoekspelletjes en beloningsspelletjes begeleiden.'],['Vaccinaties en dierenarts','Bespreek vaccinaties, ontworming, parasietenpreventie, chipregistratie en groei met je dierenarts. Neem bij herhaald braken, ernstige diarree, lusteloosheid of niet willen drinken contact op met de dierenarts.'],['Lichaamstaal en grenzen','Wegkijken, liplikken, bevriezen, wegkruipen of gapen kunnen stresssignalen zijn. Geef ruimte en voorkom dat Balou gedwongen contact moet maken.'],['Verzorging','Oefen kort en positief met borstelen, pootjes aanraken, oren bekijken en tanden verzorgen. Beloon medewerking en stop bij spanning.'],['Veilig thuis','Berg kabels, medicijnen, schoonmaakmiddelen en giftige voeding (zoals chocolade, druiven/rozijnen en xylitol) veilig op. Let op kleine voorwerpen die ingeslikt kunnen worden.']];
function render(){ $('today').textContent=new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());$('intro').innerHTML=atHome?`Balou is <b>${weeks} weken en ${ageDays%7} dagen</b> oud. Vandaag passen we zijn activiteiten aan zijn leeftijd aan.`:`Nog <b>${days(cfg.home,date)} dagen</b> tot Balou thuiskomt. Je kunt alvast zijn eerste weken voorbereiden.`;let tasks=atHome?schedule:[];$('vandaag').innerHTML=`<div class="card"><h2>${atHome?'Dagoverzicht':'Voorbereiden op Balou'}</h2><div class="grid"><div class="metric"><strong>${weeks} weken</strong><span>Geschatte leeftijd</span></div><div class="metric"><strong>${walk} min</strong><span>Rustige wandeling (indicatie)</span></div></div><p class="muted">Tijden zijn suggesties, geen strakke verplichting. Plaspauzes komen extra na slapen, spelen en eten, en bij jonge pups vaak ieder uur dat ze wakker zijn.</p></div>${atHome?`<div class="card"><div class="topline"><h2>Vandaag afvinken</h2><span class="tag">${tasks.length} activiteiten</span></div><div id="prog"></div>${tasks.map(x=>entry(...x)).join('')}</div>`:`<div class="card"><h2>Voor de komst</h2>${entry('bench','Maak een rustige slaapplek','Een veilige bench of puppyren, zonder verplicht opsluiten.')}${entry('dierenarts','Regel een dierenarts','Controleer vaccinatiegegevens, chip en gezondheidscheck.')}${entry('veilig','Maak het huis puppyveilig','Kabels, giftige spullen en kleine voorwerpen opruimen.')}${entry('gezin','Spreek gezinsregels af','Rust bij slapen/eten, belonen van gewenst gedrag en wie welke ronde doet.')}</div>`}<div class="note">Let op: bij kreupelheid, pijn, opvallende vermoeidheid of stress pas je het programma aan en overleg je zo nodig met de dierenarts.</div>`;if(atHome)$('prog').innerHTML=progress();$('uitlaten').innerHTML=`<div class="card"><h2>Uitlaatschema</h2><p>Voor ${weeks} weken: <b>ongeveer ${walk} minuten</b> per rustig snuffelrondje als Balou dat goed aankan. Dit is een flexibel voorstel, geen minimum of harde bovengrens.</p><div class="note">Bij jonge pups: ook buiten de wandelingen vaak kort naar buiten om te plassen, vooral na slapen, eten en spelen. Afstand is minder belangrijk dan ontspannen bewegen.</div>${schedule.filter(x=>x[0].startsWith('wandeling')||x[0]==='wakker'||x[0]==='naontbijt'||x[0]==='laatste').map(x=>entry('walk_'+x[0],x[1],x[2],x[3])).join('')}</div><div class="card"><h2>Wat is een goed rondje?</h2><p>Snuffelen, rustig lopen, korte pauzes en teruggaan voordat hij overprikkeld raakt. Vrij bewegen op een veilige plek is anders dan gedwongen kilometers lopen.</p></div>`;$('oefenen').innerHTML=`<div class="card"><h2>Oefeningen voor vandaag</h2><p class="muted">Doe per oefening ongeveer ${training} minuten of korter. Stop terwijl het nog leuk is.</p>${[0,1,2].map((j)=>{let idx=(Math.floor(days(date,cfg.home)/2)+j*3+exerciseBank.length*100)%exerciseBank.length;let x=exerciseBank[idx];return entry('train_'+j,x[0],x[1],'Oefening '+(j+1))}).join('')}</div><div class="card"><h2>Alle oefeningen</h2>${exerciseBank.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</div>`;$('gids').innerHTML=`<div class="card"><h2>De complete puppygids</h2><p class="muted">Praktische, positieve opvoedingstips voor Balou. Tik op een onderwerp om de uitleg te openen.</p>${guide.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</div>`;$('instellingen').innerHTML=`<div class="card"><h2>Balou instellen</h2><p class="muted">De geboortedatum is voorlopig geschat. Vul de echte datum in zodra je die weet.</p><label>Geboortedatum</label><input id="birth" type="date" value="${cfg.birth}"><label>Thuiskomstdatum</label><input id="home" type="date" value="${cfg.home}"><label>Opstaan</label><input id="wake" type="time" value="${cfg.wake}"><label>Laatste plasronde</label><input id="bed" type="time" value="${cfg.bed}"><label>Maaltijden per dag</label><select id="meals"><option value="3" ${cfg.meals==3?'selected':''}>3 maaltijden</option><option value="4" ${cfg.meals==4?'selected':''}>4 maaltijden</option><option value="2" ${cfg.meals==2?'selected':''}>2 maaltijden</option></select><p><button class="btn" id="save">Instellingen opslaan</button></p><p class="muted">Instellingen worden gezamenlijk opgeslagen in Firebase. Wijzigingen zijn op beide telefoons zichtbaar zodra de verbinding actief is.</p></div>`;document.querySelectorAll('[data-check]').forEach(x=>x.addEventListener('change',e=>{check(x.dataset.check,x.checked);document.querySelectorAll(`[data-check="${x.dataset.check}"]`).forEach(y=>y.checked=x.checked)}));$('save').onclick=async()=>{const newCfg={birth:$('birth').value,home:$('home').value,wake:$('wake').value,bed:$('bed').value,meals:Number($('meals').value)};const btn=$('save');btn.disabled=true;btn.textContent='Gezamenlijk opslaan…';try{if(!window.balouSync)throw new Error('Firebase is nog niet geladen');await window.balouSync.saveConfig(newCfg);localStorage.setItem('balou_config',JSON.stringify(newCfg));cfg={...cfg,...newCfg};btn.disabled=false;btn.textContent='Instellingen opslaan';alert('✓ Instellingen opgeslagen in Firebase. De nieuwe tijden gelden in het dagschema na de volgende keer openen.');}catch(err){btn.disabled=false;btn.textContent='Instellingen opslaan';alert('Opslaan in gezamenlijke app mislukt: '+(err.code||err.message));}};}
window.balouUpdateProgress = updateProgress;
window.balouConfigUpdated = incoming => { cfg={...cfg,...incoming}; const fields=['birth','home','wake','bed','meals']; for (const id of fields) { const el=$(id); if(el && document.activeElement!==el) el.value=String(cfg[id]); } }; 
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hide',x.id!==b.dataset.tab))});render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn)); }
window.addEventListener('pageshow',()=>{if(window.__balouOpenedDay && window.__balouOpenedDay!==localDay()) location.reload();});window.__balouOpenedDay=localDay();
</script>
